<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My tasks - Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <header class="topbar">
    <h1>Task Manager</h1>
    <div><span id="user-name"></span><button id="logout" type="button">Log out</button></div>
    
  </header>

  <div class="layout">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add a task</h2>
      <form id="task-form">
        <label for="title">Title</label>
        <input id="title" name="title" required maxlength="80">
        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="300"></textarea>
        <div class="row">
          <div>
            <label for="due">Due date</label>
            <input id="due" name="due" type="date">
          </div>
          <div>
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="todo">To do</option>
          <option value="doing">In progress</option>
          <option value="done">Done</option>
        </select>
        <div class="form-actions">
          <button id="save-btn" type="submit">Add task</button>
          <button id="cancel-btn" class="ghost" type="button" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Your tasks</h2>
      <div class="filters" id="filters">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="todo">To do</button>
        <button type="button" data-filter="doing">In progress</button>
        <button type="button" data-filter="done">Done</button>
      </div>
      <ul id="task-list"></ul>
      <p id="empty" class="empty" hidden>No tasks here yet. Add one using the form.</p>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
