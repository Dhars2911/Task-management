<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <main class="auth">
    <h1>Create your account</h1>
    <p>Keep all your tasks in one place.</p>
    <form id="auth-form">
      <label for="name">Name</label>
      <input id="name" name="name" required autocomplete="name">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password (6+ characters)</label>
      <input id="password" name="password" type="password" minlength="6" required autocomplete="new-password">
      <div id="error" class="error" role="alert" hidden></div>
      <button type="submit">Create account</button>
    </form>
    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
